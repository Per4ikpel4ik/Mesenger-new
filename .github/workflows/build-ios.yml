name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # В gradle.properties лежит путь к JDK от Windows-ПК — на облачном Mac его нет.
      - name: Remove Windows JDK path
        run: sed -i '' '/org.gradle.java.home/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Kotlin framework (iPhone)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Add GoogleService-Info.plist from secret
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST_B64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build app (unsigned)
        env:
          GIF_API_KEY: ${{ secrets.GIF_API_KEY }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: >
          xcodebuild
          -project iosApp/PingGram.xcodeproj
          -scheme PingGram
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath ios-build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          GIF_API_KEY="$GIF_API_KEY"
          TURN_USERNAME="$TURN_USERNAME"
          TURN_PASSWORD="$TURN_PASSWORD"
          build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios-build/Build/Products/Release-iphoneos/PingGram.app Payload/
          zip -qr PingGram.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PingGram-ipa
          path: PingGram.ipa
