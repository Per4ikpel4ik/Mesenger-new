name: iOS simulator screenshots

# Запускается вручную: Actions -> iOS simulator screenshots -> Run workflow.
# Собирает приложение под симулятор iPhone, запускает его в облаке и сохраняет
# скриншоты, видео и логи в артефакт simulator-results.
on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Remove Windows JDK path
        run: sed -i '' '/org.gradle.java.home/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Kotlin framework (simulator)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --stacktrace

      - name: Add GoogleService-Info.plist from secret
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST_B64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      # В project.yml прописан путь к фреймворку для реального iPhone —
      # для симулятора подменяем его на фреймворк симулятора.
      - name: Point Xcode project at the simulator framework
        run: sed -i '' 's#iosArm64/releaseFramework#iosSimulatorArm64/releaseFramework#g' iosApp/project.yml

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      - name: Build app for simulator
        run: >
          xcodebuild
          -project iosApp/PingGram.xcodeproj
          -scheme PingGram
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios-build
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Run in simulator, record video and screenshots
        run: |
          set -x
          mkdir -p results
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(data.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios-build/Build/Products/Release-iphonesimulator/PingGram.app
          xcrun simctl io "$UDID" recordVideo --codec h264 --force results/video.mov &
          REC_PID=$!
          sleep 3
          xcrun simctl launch "$UDID" com.rosechat.shared
          sleep 15
          xcrun simctl io "$UDID" screenshot results/screen1.png
          sleep 10
          xcrun simctl io "$UDID" screenshot results/screen2.png
          kill -INT $REC_PID || true
          wait $REC_PID || true
          (xcrun simctl spawn "$UDID" launchctl list | grep -i rosechat > results/running.txt) || echo "app is NOT running (crashed or exited)" > results/running.txt
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "PingGram"' > results/app.log || true
          cp ~/Library/Logs/DiagnosticReports/PingGram* results/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: results
